<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Marque Piksel. Le 4e carré s'éclaircit quand l'onglet est en thème
       sombre, sinon il disparaîtrait sur le fond noir. -->
  <style>
    .f { fill: #1d1d1f; }
    @media (prefers-color-scheme: dark) { .f { fill: #f5f5f7; } }
  </style>
  <rect x="0"  y="0"  width="11" height="11" rx="1.4" fill="#0071e3"/>
  <rect x="13" y="0"  width="11" height="11" rx="1.4" fill="#0071e3"/>
  <rect x="0"  y="13" width="11" height="11" rx="1.4" fill="#0071e3"/>
  <rect x="13" y="13" width="11" height="11" rx="1.4" class="f"/>
</svg>
